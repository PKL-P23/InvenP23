name: Import PinjamBalik frontend
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-frontend.yml'
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Import verified public files into main
        if: github.ref == 'refs/heads/main' && hashFiles('index.html') == ''
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/invenp23-frontend.zip"
          curl --fail --silent --show-error --retry 3 --output "$archive" https://rakruang-qr.geksonsimanjuntak00.chatgpt.site/invenp23-frontend.zip
          echo "d38aba19ab9d8a8f7c64304e65adbfde425078dc12f601d914bcde5fd598b302  $archive" | sha256sum --check
          unzip -oq "$archive"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md *.css *.js *.html *.svg *.webp *.woff2 *.LICENSE.txt
          git commit -m 'Publish PinjamBalik inventory dashboard and QR workflows'
          git push origin HEAD:main
